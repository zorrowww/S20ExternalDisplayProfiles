name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build free debug APK
        run: ./gradlew --no-daemon :app:assembleFreeDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecondScreen-free-debug
          path: app/build/outputs/apk/free/debug/*.apk
          if-no-files-found: error
          retention-days: 14
