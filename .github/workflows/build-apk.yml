name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build free APKs (Release & Debug)
        run: ./gradlew --no-daemon :app:assembleFreeRelease :app:assembleFreeDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecondScreen-APKs
          path: app/build/outputs/apk/free/*/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.9.4-samsung-latest
          name: SecondScreen 2.9.4 for Samsung S20 (Release & Debug)
          body: |
            Automated build with:
            - Gravity sensor auto-rotate for portrait and landscape video playback
            - Samsung One UI home launcher orientation sync
            - Camera cutout overlap policy automation (removes punch hole black bars)
            - 100% synchronized HDMI rotation via IRotationWatcher
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/free/release/SecondScreen-2.9.4-release.apk
            app/build/outputs/apk/free/debug/SecondScreen-2.9.4-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
